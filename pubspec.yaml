name: pure_app
description: "PURE — Motion, made uniquely yours."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  provider: ^6.1.5

  # 시뮬레이터 (sim/ 웹 번들을 로컬 서버로 서빙 + 양방향 JS)
  flutter_inappwebview: ^6.1.5

  # 입력
  image_picker: ^1.2.3
  fc_native_video_thumbnail: ^3.0.1
  # 영상 길이를 읽는 데만 쓴다. image_picker 는 앨범에서 고른 영상의 길이를 주지 않는다.
  video_player: ^2.14.1
  speech_to_text: ^7.5.0

  # 저장
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # 기타
  wakelock_plus: ^1.8.1
  http: ^1.6.0
  # Figma 에서 뽑은 아이콘을 그린다. 색은 코드에서 입힌다(토큰 사용).
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  config:
    # Swift Package Manager 를 끄고 CocoaPods 만 쓴다.
    # Flutter 가 만드는 SPM 패키지는 iOS 13.0 으로 고정돼 있는데
    # fc_native_video_thumbnail 이 14.0 을 요구해서, flutter pub get 뒤
    # Xcode 에서 바로 빌드하면 패키지 해석이 실패한다.
    # Podfile 은 이미 platform :ios, '14.0' 이라 pods 경로에는 문제가 없다.
    enable-swift-package-manager: false

  fonts:
    # Pretendard (OFL 1.1). 시안의 Google Sans Flex 대신 쓴다 — 한글까지 한 파일로
    # 덮고 라이선스가 자유롭다. 시안이 쓰는 굵기는 400·500·600 셋이다.
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/video/
    # Flutter 의 폴더 선언은 하위 폴더를 포함하지 않는다. sim 번들의 모든 폴더를
    # 하나씩 적어야 한다 — 빠뜨리면 로컬 서버가 200 에 0바이트를 돌려줘 조용히 실패한다.
    # scripts/build_sim.sh 가 빌드할 때마다 이 목록을 검사한다.
    - assets/sim/
    - assets/sim/assets/
    - assets/sim/mujoco/
    - assets/sim/pure-desk/faces/
    - assets/sim/pure-desk/model/
    - assets/sim/pure-desk/model/assets/
