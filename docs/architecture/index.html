# PURE App — 기술 구조 문서

> Motion, made uniquely yours.
> 상황을 말하거나(칩·텍스트·음성) 영상을 보여주면 LLM이 PURE Desk 로봇의 움직임을 만들고,
> 앱 안의 MuJoCo 물리 시뮬레이터가 그 움직임을 실시간으로 재생 → 저장 → 라이브러리로 관리한다.

기준 시점: 2026-10-13 · `main` 브랜치 (STEP 25 마감까지 반영)

## 문서 목록

| # | 문서 | 무엇을 보여주는가 |
|---|---|---|
| 1 | [System Architecture](01-system-architecture.md) | 앱을 구성하는 계층·모듈과 외부 시스템, 기술 스택 |
| 2 | [Data Flow Diagram](02-data-flow-diagram.md) | 입력(말·영상)이 로봇 움직임과 저장 데이터가 되기까지의 데이터 흐름 (Level 0 / Level 1) |
| 3 | [Sequence Diagram](03-sequence-diagram.md) | 앱 부팅, 텍스트 생성·재생, 영상 입력, 폴백, 저장 시나리오의 시간 순서 |
| 4 | [Functional Architecture](04-functional-architecture.md) | 기능 분해도와 기능 ↔ 모듈 대응표 |

브라우저에서 한 번에 보려면 [`index.html`](index.html)을 연다 (다이어그램 렌더링에 인터넷 연결 필요).

## 한눈에 보는 구조

```mermaid
flowchart LR
  U([사용자]) -->|칩 · 텍스트 · 음성 · 영상| APP[Flutter 앱<br/>화면 · 상태 · 서비스]
  APP -->|프롬프트 + 프레임| LLM[(OpenAI<br/>→ Ollama<br/>→ 데모)]
  LLM -->|레시피 JSON| ENG[Motion Engine<br/>검증 · 클램프 · 시그니처 반영]
  ENG -->|window.pure.playRecipe| SIM[MuJoCo 시뮬레이터<br/>WebView 안 wasm + WebGL]
  SIM -->|ready · playing · ended| APP
  APP -->|JSON 파일| DB[(로컬 저장소<br/>pure_state.json<br/>thumbnails/)]
```

## 핵심 설계 결정 요약

1. **LLM은 관절 값을 직접 만들지 않는다.** 미리 검증된 동작 15종을 조합한 "레시피"(최대 6단계, 속도·크기·반복·표정)만 만든다. 결과는 `MotionEngine`이 허용 목록·범위로 검증한다.
2. **시연 경로가 죽지 않는다.** 생성은 OpenAI → 로컬 모델(Ollama) → 데모 레시피 3단 폴백. 키 없음·오프라인·크레딧 소진·잘못된 응답 모두 결국 움직임이 나온다.
3. **시뮬레이터는 봉인된 모듈이다.** Flutter와 시뮬레이터의 접점은 `sim/src/api.ts`가 노출하는 `window.pure` 하나뿐이다. WebView 인스턴스도 앱 전체에 하나(wasm 컴파일 비용).
4. **모션 시그니처가 개성을 만든다.** 성격·관계·표현 방식 설정이 재생 속도·진폭 배율, 대기 모션, 인사 앞 동작으로 번역되어 모든 생성 결과에 미리 곱해진다.
5. **서버가 없다.** 졸업전시 시연용이라 배포·계정 서버 없이 기기 안 JSON 파일로 저장한다. 영상·프레임은 API 전송 외에는 앱 밖으로 나가지 않는다.

| 구분 | 단계 | 상태 |
|---|---|---|

| 디자인 | 20 토큰 · 21 폰트·에셋 · 22 Figma 화면 번역 · 23 폴리시 · 24 연출 · 25 마감·실기기 | 완료 |
| 추가 | 로컬 모델(Ollama) 2차 생성 경로 | 완료 |

# 1. System Architecture

PURE App은 **Flutter 앱(iOS)** 과 그 안에 내장된 **웹 시뮬레이터 모듈(sim/)** 두 덩어리로 이루어진다.
앱은 계층형 구조(화면 → 상태 → 서비스 → 저장소)를 따르고, 시뮬레이터는 WebView 하나에 올라간 독립 모듈로 `window.pure` 계약으로만 통신한다.

## 1.2 계층별 책임

| 계층 | 위치 | 책임 | 하지 않는 일 |
|---|---|---|---|
| Presentation | `lib/screens`, `lib/widgets`, `lib/theme` | Figma 시안을 토큰 기반 위젯으로 그림, 사용자 입력 수집 | 비즈니스 규칙, 색·문구 하드코딩 |
| State | `lib/providers` | 화면 상태 보관, 서비스·저장소 호출 순서 조율 | 네트워크·파일 직접 접근 |
| Service | `lib/services` | 생성 정책(폴백·취소·검증), 모션 수학, 영상·음성 입력 처리 | UI 의존 |
| Data | `lib/repositories`, `lib/data` | 영속화(JSON 파일), 정적 콘텐츠(칩·질문·허용 동작·데모 레시피·문구) | — |
| Sim Bridge | `lib/sim` | WebView 1개 생명주기, Dart ↔ JS 호출과 이벤트 변환 | 모션 계산 |
| Simulator | `sim/` → `assets/sim` | 물리 시뮬레이션, 3D 렌더, 동작 재생 | 앱 상태·생성 로직 |

## 1.3 생성 계층 구조 (Strategy + Policy 분리)

```mermaid
classDiagram
  class GenerationService {
    +generate(request) GenerationResult
    +cancelInFlight()
    +soften(spec) MotionSpec
    -_finish(result) 검증 + 시그니처 반영
    forceDemo: bool
  }
  class GenerationClient {
    <<abstract>>
    +isAvailable bool
    +generate(request, cancel, onDelay) GenerationResult
  }
  class OpenAIClient {
    gpt-4o-mini (텍스트)
    gpt-4o (영상 프레임)
    json_schema strict 응답
    재시도 1s·2s·4s, 타임아웃 60s
  }
  class OllamaClient {
    /api/chat, qwen3:8b
    텍스트 전용 → 프레임 있으면 unsupported
  }
  class DemoClient {
    data/demo_recipes 중 가장 가까운 것
  }
  class MotionEngine {
    +validateRecipe()
    +signatureToParams()
    +applySignature()
    +applySoftener()
    +demoMatch()
  }
  GenerationClient <|-- OpenAIClient
  GenerationClient <|-- OllamaClient
  GenerationClient <|-- DemoClient
  GenerationService o-- GenerationClient : primary / secondary / fallback
  GenerationService ..> MotionEngine
```

클라이언트는 "모델에 물어본다"만 알고, 폴백·검증·취소 정책은 `GenerationService` 한 곳에 모은다.
덕분에 생성 경로를 늘려도(예: Ollama 추가) 정책 코드는 바뀌지 않았다.

## 1.4 시뮬레이터 모듈과 계약

시뮬레이터는 웹 프로젝트(`_ref/pure-web`, Next.js)에서 필요한 부분만 추출해 Vite + TypeScript로 다시 묶은 것이다.
빌드 산출물은 `assets/sim/`에 들어가고, 앱 안의 로컬 HTTP 서버(`InAppLocalhostServer`, 포트 8080)가 WebView에 제공한다.

| `window.pure` 함수 | 역할 |
|---|---|
| `playBehavior(name, {speed, amplitude})` | 동작 15종 중 하나 재생 |
| `playRecipe({steps[≤6], loop}, params)` | 레시피(동작 조합) 재생 — 기본 경로 |
| `playClip({format:'lelamp.clip/1', duration, tracks})` | 관절별 키프레임 재생 — 실험 경로 |
| `setIdle({behavior, speed, amplitude})` | 대기 모션 지정 (시그니처 반영) |
| `setFace(name)` | 얼굴 화면 7종 전환 |
| `stop()` · `setView()` · `enableOrbit()` · `capture()` | 정지, 카메라, 썸네일 캡처 |
| 이벤트 `ready` / `playing` / `ended` / `error` | JS → Dart (`callHandler('pureEvent')`) |

계약 계층이 하는 일:
1. **관절 이름 변환** — 외부 이름(`base_yaw, shoulder_pitch, elbow_pitch, head_pan, head_tilt`) ↔ 엔진 내부 채널(`base_yaw, base_pitch, elbow_pitch, wrist_roll, wrist_pitch`) ↔ MuJoCo `robot.xml` 서보 1~5.
2. **입력 검증** — 범위 밖 값이나 모르는 동작·얼굴은 조용히 0으로 만들지 않고 예외를 던진다. Dart 쪽 `SimController`가 이를 `SimCallException`으로 올린다.
3. **ready 시 관절 한계 전달** — 관절 범위를 런타임에 앱으로 넘겨 앱과 시뮬이 같은 값을 쓴다.

### WebView를 하나만 쓰는 이유
MuJoCo wasm 컴파일과 3D 씬 준비에 시간이 걸리므로 앱 전체에서 WebView를 한 번만 만든다.
`SimHost`가 앱 최상단에 WebView를 띄워 두고, 각 화면은 `SimSlot` 위젯으로 "여기에 보여 달라"는 자리만 요청한다. 보이는 슬롯이 없으면 화면 밖으로 옮겨 둔다. 스플래시가 떠 있는 동안 뒤에서 wasm이 올라간다.

## 1.5 기술 스택

| 영역 | 사용 기술 |
|---|---|
| 앱 | Flutter 3.44 / Dart 3.12, Provider |
| 시뮬레이터 | Vite + TypeScript, MuJoCo (WebAssembly), Three.js (WebGL) |
| 앱 ↔ 시뮬 | flutter_inappwebview (`InAppLocalhostServer`, `evaluateJavascript`, JavaScript handler) |
| 생성 | OpenAI Chat Completions (`gpt-4o-mini`, 영상은 `gpt-4o`, `json_schema` strict), Ollama `/api/chat` (`qwen3:8b`) |
| 입력 | speech_to_text (en_US), image_picker, fc_native_video_thumbnail (프레임 추출) |
| 저장 | path_provider + JSON 파일(`pure_state.json`, 원자적 rename 쓰기) |
| 기타 | wakelock_plus (전시 중 화면 꺼짐 방지), http |
| 설정 주입 | `--dart-define` (OPENAI_API_KEY, OPENAI_MODEL, OPENAI_VISION_MODEL, OLLAMA_HOST, OLLAMA_MODEL) — 키는 코드·파일에 두지 않음 |
| 대상 기기 | iPhone 14 Pro (393×852pt), 최소 iOS 14.0 |

# 2. Data Flow Diagram (DFD)

표기: `([ ])` 외부 개체 · `[ ]` 처리(Process) · `[( )]` 데이터 저장소 · 화살표 라벨 = 흐르는 데이터

## 2.1 Level 0 — Context Diagram

시스템 전체를 하나의 처리로 보고, 바깥과 주고받는 데이터만 표시한다.

```mermaid
flowchart LR
  USER([사용자])
  OPENAI([OpenAI API])
  OLLAMA([Ollama<br/>로컬 모델])
  IOS([iOS 서비스<br/>음성 인식 · 카메라 · 사진])

  SYS[["0<br/>PURE App<br/>모션 생성 · 재생 · 관리 시스템"]]

  USER -->|상황 칩 선택 · 텍스트 · 음성 · 영상| SYS
  USER -->|모션 시그니처 설정| SYS
  USER -->|피드백 · 저장 · 재생 요청| SYS

## 2.5 시그니처가 숫자로 바뀌는 방식

모션 시그니처는 LLM 프롬프트에 **문장**으로 들어가고(결과의 성격을 유도), 동시에 생성 결과에 **배율**로 곱해진다(결과를 확실히 맞춤).

| 시그니처 축 | 변환 | 값 |
|---|---|---|
| lively (성격) | 재생 속도 | 0.7 → 1.4 선형 보간 |
| expression | 속도 계수 | Quick & bouncy ×1.2 · Slow & smooth ×0.8 · In between ×1.0 |
| bold (성격) | 진폭 | 0.6 → 1.3 선형 보간 |
| richness | 진폭 계수 | 0.85 → 1.15 |
| 성격 | 대기 모션 | bold ≥ 70 → `curious` · lively ≥ 55 → `look_around` · 그 외 `doze` |
| relationship | 인사 앞 동작 | Comes to me first → `focus` · Waits till I'm near → 없음 · Only when needed → `nod` |

최종 속도는 0.5–1.6, 진폭은 0.5–1.3으로 다시 자른다. 시뮬레이터에 배율을 또 넘기면 두 번 곱해져 관절 한계를 넘기 때문에, 배율은 레시피에 **미리 한 번만** 곱한다.

| 데이터 | 저장 위치 | 외부 전송 |

| 썸네일 | 앱 Documents `thumbnails/*.png` | 없음 |

## 4.5 품질 속성과 이를 보장하는 장치

| 품질 속성 | 요구 | 장치 |
|---|---|---|
| 가용성 (시연이 멈추지 않음) | 키 없음·오프라인·크레딧 소진에도 움직임이 나와야 함 | 3단 폴백, `GenerationService`는 취소 외에 예외를 던지지 않음, 강제 데모 토글 |
| 안전성 (로봇이 이상하게 움직이지 않음) | LLM 출력이 관절 한계를 넘거나 없는 동작을 부르면 안 됨 | 동작 조합(레시피) 방식, `MotionEngine` 허용 목록·클램프, 시뮬 계약의 2차 검증 |
| 응답성 | 생성 대기 체감 최소화 | 20초 지연 안내, 60초 타임아웃, 새 전송 시 이전 요청 취소, 스플래시 동안 wasm 선로딩 |
| 데이터 무결성 | 전시 중 앱이 죽어도 라이브러리가 남아야 함 | 임시 파일 → rename 원자적 쓰기, 깨진 파일은 빈 상태로 복구 |
| 성능 | wasm 재컴파일 비용 회피 | WebView 1개를 화면 간 이동 (`SimHost`/`SimSlot`) |
| 프라이버시 | 영상·키 유출 방지 | 프레임은 API 요청에만, 키는 `--dart-define`으로만 주입 |
| 유지보수성 | 시뮬과 앱의 독립 | `window.pure` 단일 계약, sim/ 봉인, 생성 정책/전송 분리 |
